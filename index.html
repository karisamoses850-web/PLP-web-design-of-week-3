<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <!-- Google Fonts Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to your CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <!-- Card 1: Page Heading -->
        <header>
            <h1>My Budget Tracker</h1>
            <p>Keep track of your monthly income and expenses.</p>
        </header>

        <!-- Card 2: Add Expense Form -->
        <section>
            <h2>Add New Expense</h2>
            <form>
                <div>
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries">
                </div>
                <div>
                    <label for="expense-amount">Amount ($)</label>
                    <input type="number" id="expense-amount" placeholder="0.00">
                </div>
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <!-- Card 3: Expense Table -->
        <section>
            <h2>Expense History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Grocery Store</td>
                        <td>Food</td>
                        <td>$45.50</td>
                    </tr>
                    <tr>
                        <td>Electric Bill</td>
                        <td>Utilities</td>
                        <td>$85.20</td>
                    </tr>
                    <tr>
                        <td>Movie Night</td>
                        <td>Entertainment</td>
                        <td>$25.00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
